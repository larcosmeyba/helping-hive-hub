name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      - name: Derive version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Strip pre-release suffix for Android versionName (e.g. 1.0.0-beta.3 -> 1.0.0)
          VERSION_NAME=${VERSION%%-*}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Derived VERSION_NAME=$VERSION_NAME (from $VERSION)"

      - name: Bump versionCode and versionName
        run: |
          sed -i "s/versionCode [0-9]*/versionCode 17/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Updated version info:"
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android build for Play Store compliance
        run: |
          # --- ProGuard rules for Capacitor ---
          mkdir -p android/app
          cat > android/app/proguard-rules.pro << 'PROGUARD'
          # Capacitor core
          -keep public class com.getcapacitor.** { *; }
          -keep public class com.getcapacitor.Bridge { *; }
          -keep public class com.getcapacitor.Plugin { *; }
          -keep public class com.getcapacitor.annotation.* { *; }
          -keep public class * extends com.getcapacitor.Plugin { *; }

          # Keep all plugin classes
          -keep class com.capacitorjs.plugins.** { *; }

          # Keep BridgeWebViewClient and related WebView classes
          -keep public class com.getcapacitor.BridgeWebViewClient { *; }
          -keep public class androidx.webkit.** { *; }
          -keep public class * extends android.webkit.WebViewClient { *; }

          # Keep Capacitor's Config
          -keep public class com.getcapacitor.CapConfig { *; }

          # Keep native methods
          -keepclasseswithmembernames class * { native <methods>; }

          # Keep JS bridge interface
          -keepattributes JavascriptInterface
          -keep public class * {
              @android.webkit.JavascriptInterface <methods>;
          }

          # Keep serializable / parcelable
          -keepattributes *Annotation*, Signature, Exception, InnerClasses, EnclosingMethod
          -keepclassmembers enum * { public static **[] values(); public static ** valueOf(java.lang.String); }
          -keep class * implements android.os.Parcelable { public static final android.os.Parcelable$Creator *; }

          # Capacitor JSON serialization
          -keepclassmembers class * {
              @com.google.gson.annotations.SerializedName <fields>;
          }
          -keep class com.google.gson.** { *; }
          -keep class com.google.gson.reflect.TypeToken { *; }
          -keep class * extends com.google.gson.reflect.TypeToken { *; }

          # Suppress warnings for missing dependencies
          -dontwarn com.google.errorprone.annotations.*
          -dontwarn javax.annotation.**
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          -dontwarn java.lang.management.**
          -dontwarn com.getcapacitor.android.BuildConfig
          PROGUARD

          # --- Patch build.gradle with Python for reliability ---
          python3 << 'PYEOF'
          import re

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              content = f.read()

          # 1) Enable minifyEnabled true in release build type
          if "minifyEnabled" in content:
              content = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled true', content)
          else:
              # Insert into release block
              content = re.sub(
                  r'(buildTypes\s*\{[^}]*release\s*\{)',
                  r'\1\n            minifyEnabled true',
                  content,
                  flags=re.DOTALL
              )

          # 2) Enable shrinkResources true in release
          if "shrinkResources" in content:
              content = re.sub(r'shrinkResources\s+\w+', 'shrinkResources true', content)
          else:
              content = re.sub(
                  r'(buildTypes\s*\{[^}]*release\s*\{)',
                  r'\1\n            shrinkResources true',
                  content,
                  flags=re.DOTALL
              )

          # 3) Ensure proguardFiles points to our rules
          content = re.sub(
              r"proguardFiles\s+getDefaultProguardFile\([^)]+\),\s*'[^']*'",
              "proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'",
              content
          )

          # 4) Add NDK debugSymbolLevel FULL inside defaultConfig
          if "ndk" not in content or "debugSymbolLevel" not in content:
              # Insert ndk block before the closing brace of defaultConfig
              content = re.sub(
                  r'(defaultConfig\s*\{)(.*?)(\n\s*\})',
                  lambda m: f'{m.group(1)}{m.group(2)}\n        ndk {{\n            debugSymbolLevel \'FULL\'\n        }}\n    }}',
                  content,
                  count=1,
                  flags=re.DOTALL
              )

          with open(gradle_path, "w") as f:
              f.write(content)

          print("--- Patched build.gradle ---")
          print(content)
          PYEOF

          echo "--- ProGuard rules preview ---"
          head -25 android/app/proguard-rules.pro

      - name: Setup Android signing

      - name: Setup Android signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Fail if signing secrets missing
        run: |
          if [ -z "$KEYSTORE_PATH" ] || [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Android keystore secrets are not configured. Refusing to build an unsigned release."
            echo "Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build Release AAB (for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
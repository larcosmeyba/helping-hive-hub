name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      - name: Derive version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Strip pre-release suffix for Android versionName (e.g. 1.0.0-beta.3 -> 1.0.0)
          VERSION_NAME=${VERSION%%-*}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Derived VERSION_NAME=$VERSION_NAME (from $VERSION)"

      - name: Bump versionCode and versionName
        run: |
          sed -i "s/versionCode [0-9]*/versionCode 17/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Updated version info:"
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android build for Play Store compliance
        run: |
          # --- ProGuard rules for Capacitor ---
          cat > android/app/proguard-rules.pro << 'EOF'
          # Capacitor core
          -keep public class com.getcapacitor.** { *; }
          -keep public class com.getcapacitor.Bridge { *; }
          -keep public class com.getcapacitor.Plugin { *; }
          -keep public class com.getcapacitor.annotation.* { *; }
          -keep public class * extends com.getcapacitor.Plugin { *; }
          -keep public class * extends com.getcapacitor.PluginHandle { *; }

          # Keep all plugin classes
          -keep class com.capacitorjs.plugins.** { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }

          # Keep BridgeWebViewClient and related WebView classes
          -keep public class com.getcapacitor.BridgeWebViewClient { *; }
          -keep public class androidx.webkit.** { *; }
          -keep public class * extends android.webkit.WebViewClient { *; }

          # Keep Capacitor's Config
          -keep public class com.getcapacitor.CapConfig { *; }

          # Keep native methods
          -keepclasseswithmembernames class * { native <methods>; }

          # Keep JS bridge interface
          -keepattributes JavascriptInterface
          -keep public class * {
              @android.webkit.JavascriptInterface <methods>;
          }

          # Keep serializable / parcelable
          -keepattributes *Annotation*, Signature, Exception, InnerClasses, EnclosingMethod
          -keepclassmembers enum * { public static **[] values(); public static ** valueOf(java.lang.String); }
          -keep class * implements android.os.Parcelable { public static final android.os.Parcelable$Creator *; }

          # Capacitor JSON serialization
          -keepclassmembers class * {
              @com.google.gson.annotations.SerializedName <fields>;
          }
          -keep class com.google.gson.** { *; }
          -keep class com.google.gson.reflect.TypeToken { *; }
          -keep class * extends com.google.gson.reflect.TypeToken { *; }

          # Suppress warnings for missing dependencies
          -dontwarn com.google.errorprone.annotations.*
          -dontwarn javax.annotation.**
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          -dontwarn java.lang.management.**
          -dontwarn com.getcapacitor.android.BuildConfig
          EOF

          # --- Patch build.gradle for R8 + debug symbols ---
          GRADLE="android/app/build.gradle"

          # 1) Enable R8 minification and resource shrinking for release builds
          sed -i 's/minifyEnabled false/minifyEnabled true/g' "$GRADLE"
          # Some Capacitor templates don't have the line at all; ensure it's added if missing
          if ! grep -q 'minifyEnabled' "$GRADLE"; then
            # Insert after shrinkResources line if it exists, or after buildTypes/release block start
            sed -i '/shrinkResources true/a\            minifyEnabled true' "$GRADLE" 2>/dev/null || \
            sed -i '/buildTypes {/a\        release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile('\''proguard-android-optimize.txt'\''), '\''proguard-rules.pro'\''\n        }' "$GRADLE"
          fi

          # 2) Ensure shrinkResources is true
          if grep -q 'shrinkResources' "$GRADLE"; then
            sed -i 's/shrinkEnabled false/shrinkResources true/g' "$GRADLE"
          fi

          # 3) Ensure proguardFiles points to our rules
          if grep -q 'proguardFiles' "$GRADLE"; then
            sed -i "s|proguardFiles .*|proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'|g" "$GRADLE"
          fi

          # 4) Enable NDK debug symbol generation for native code
          if ! grep -q 'ndk.debugSymbolLevel' "$GRADLE"; then
            # Insert inside android.defaultConfig block
            sed -i "/defaultConfig {/,/}/ { /}/i\\\n        ndk {\n            debugSymbolLevel '\''FULL'\''\n        }\n
 }" "$GRADLE"
          fi

          # 5) Enable mapping file upload (AGP 4.1+) by ensuring the build type produces it
          if ! grep -q 'mappingFileUploadEnabled' "$GRADLE"; then
            sed -i "/buildTypes {/,/}/ { /release {/a\\\n            firebaseCrashlytics {\n                mappingFileUploadEnabled false\n            }\n
 }" "$GRADLE"
          fi

          echo "--- Final build.gradle release block ---"
          grep -A 15 'buildTypes' "$GRADLE" || true
          echo "--- NDK config ---"
          grep -A 4 'ndk' "$GRADLE" || true
          echo "--- ProGuard rules created ---"
          head -20 android/app/proguard-rules.pro

      - name: Setup Android signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Fail if signing secrets missing
        run: |
          if [ -z "$KEYSTORE_PATH" ] || [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Android keystore secrets are not configured. Refusing to build an unsigned release."
            echo "Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build Release AAB (for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
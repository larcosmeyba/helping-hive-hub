<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Help The Hive — Free Meal Planning & Grocery Lists for Every Family</title>
    <meta name="description" content="Free forever meal plans and grocery lists that fit your budget — at the store you already shop at. No subscription, no paywall, ever." />
    <meta name="author" content="Help The Hive" />
    <meta name="theme-color" content="#F2B233" />
    <!-- Content Security Policy is injected by vite.config.ts so local dev can
         allow local Supabase without shipping those endpoints in production.
         frame-ancestors must be configured as an HTTP response header. -->
    <meta http-equiv="Content-Security-Policy" content="__HELP_THE_HIVE_CSP__" />
    <!-- Canonical is set per-route via <Seo /> (react-helmet-async). Sitewide og:* below is the fallback for non-JS social crawlers. -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Preconnect to Supabase API for faster auth/data calls -->
    <link rel="preconnect" href="https://ndbqbhghjsjkpgcvkvtq.supabase.co" crossorigin />
    <!-- Preload the homepage hero image (stable path under /public) -->
    <link rel="preload" as="image" href="/hero-family.jpg" fetchpriority="high" />
    <!-- DNS prefetch for Kroger (used when user taps Shop at Kroger) -->
    <link rel="dns-prefetch" href="https://www.kroger.com" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Help The Hive — Free Meal Planning & Grocery Lists for Every Family" />
    <meta property="og:description" content="Free forever meal plans and grocery lists that fit your budget — at the store you already shop at. No subscription, no paywall, ever." />
    <meta property="og:image" content="https://helpthehive.com/og-image.png" />
    <meta property="og:url" content="https://helpthehive.com" />
    <meta property="og:site_name" content="Help The Hive" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Help The Hive — Free Meal Planning & Grocery Lists for Every Family" />
    <meta name="twitter:description" content="Free forever meal plans and grocery lists that fit your budget — at the store you already shop at. No subscription, no paywall, ever." />
    <meta name="twitter:image" content="https://helpthehive.com/og-image.png" />
  </head>

  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:rounded-md focus:bg-foreground focus:text-background">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
